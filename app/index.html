<!doctype html>
<html lang="en">


<head>
    <meta charset="UTF-8" />
    <title>Handoff</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
</head>

<body>

    <div class="nav-bar">
        <h1>Handoff
            <span class="subtitle">A dependency-first collaborative task management app</span>
        </h1>
    </div>


    <div id="auth-section">

        <div id="login-section">

            <h2>Login</h2>
            <form id="login-form" class="auth-form">
                <label for="login-email">Email</label>
                <input id="login-email" type="email" placeholder="xyz@gmail.com" required>
                <label for="login-password">Password</label>
                <input id="login-password" type="password" required>
                <button type="submit">Login</button>
            </form>
        </div>
        <div id="signup-section">
            <h2>Signup</h2>
            <form id="signup-form" class="auth-form">
                <label for="signup-email">Email</label>
                <input id="signup-email" type="email" placeholder="xyz@gmail.com" required>
                <label for="signup-password">Password</label>
                <input id="signup-password" type="password" required>
                <label for="display-name">Display Name</label>
                <input id="display-name" placeholder="Anuradha" required>
                <button type="submit">Signup</button>
            </form>
        </div>


    </div>

    <div id="user-page" style="display:none">
        <h2 id="welcome-message">Welcome</h2>
        <div id="actionable-tasks">
            <h3>Your actionable tasks</h3>
        </div>
        <div id="domains">
            <h3>Your domains</h3>
        </div>
    </div>

    <div id="domain-page" style="display:none">
        <h2 id="domain-heading"></h2>
        <div class="tasks-container">
            <div id="pending-domain-tasks">
                <h3>Pending Tasks</h3>
                <div id="task-card" style="display:none">
                    <p id="task-assignee"></p>
                    <ul id="task-dependencies">
                    </ul>
                </div>
            </div>
            <div id="completed-domain-tasks">
                <h3>Completed Tasks</h3>
            </div>
        </div>
        <div id="owner-controls">

        </div>
    </div>
</body>

</html>
